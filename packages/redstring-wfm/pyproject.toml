[project]
name = "redstring-wfm"
version = "0.1.0"
description = "Wiki Foundation Model (arXiv 2609.18182) retrieval over a redstring knowledge graph"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "redstring>=0.12,<0.13",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
redstring = { path = "../../", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
